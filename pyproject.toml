[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[project]
name = "network-inventory-manager"
version = "0.2.3"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
network-inventory-manager = "network_inventory_manager.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.uv.build-backend]
module-root = ""
