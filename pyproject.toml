[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-inventory-manager"
version = "2.0.1"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["network_inventory_manager*"]

[project.scripts]
network-inventory-manager = "network_inventory_manager.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "responses>=0.25",
]
