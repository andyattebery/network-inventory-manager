---
name: ci

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. 1.1.0 or v1.1.0)'
        required: true

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # On workflow_dispatch, test the tag being released, not the branch the run was started
      # from: release-branch promotes that tag on the strength of this job and of `nix`.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      # setup-uv publishes no floating major tag, so the release is pinned exactly.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
      # --locked fails when uv.lock no longer matches pyproject.toml, and every build
      # (this job, the image, the nix package) installs from that lockfile.
      - run: uv sync --locked
      - run: uv run pytest tests -v

  # Independent of `test` on purpose: the flake and the uv sync fail for unrelated
  # reasons, and there is no point serialising them.
  # Both architectures natively: the uv2nix environment is built from per-architecture wheels,
  # and otherwise arm64 is only ever exercised by the image build at release time.
  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # The tag on workflow_dispatch, as in `test`.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      # This builds checks.<system>.*, which is where the module regression test, the
      # op-cli.toml hash check and the test suite (against the package's own uv2nix
      # environment) live.
      # `nix flake check` on its own does NOT evaluate nixosModules -- it only forces the
      # attribute, which for a lambda yields the lambda unapplied -- so without a `checks`
      # entry this step would pass on a module that cannot be imported at all.
      - run: nix flake check
      # The package build does not run the tests (checks.pytest above does), so this step
      # proves only that what consumers deploy builds, for the runner's own system.
      - run: nix build

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    # github-release and release-branch read these instead of re-deriving them from the tag.
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
      # A release bumps pyproject.toml with `uv version` before tagging, and nothing fixes a
      # forgotten bump afterwards, so a tag that names another version fails here. Compared as
      # PEP 440 versions: `uv version` writes 1.0.0-rc1 as 1.0.0rc1, and both spellings are the
      # same pre-release.
      - name: Compute and check version
        id: version
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"].removeprefix("v")
          try:
              version = Version(tag)
          except InvalidVersion:
              print(f"::error::tag {tag} is not a PEP 440 version")
              raise SystemExit(1)
          with open("pyproject.toml", "rb") as f:
              project = Version(tomllib.load(f)["project"]["version"])
          if project != version:
              print(f"::error::tag {tag} does not match pyproject.toml version {project}")
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"version={tag}", file=out)
              print(f"is_release={str(not version.is_prerelease).lower()}", file=out)
          EOF
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (versioned)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/andyattebery/network-inventory-manager:${{ steps.version.outputs.version }}
      - name: Promote :latest
        if: steps.version.outputs.is_release == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/andyattebery/network-inventory-manager:latest \
            ghcr.io/andyattebery/network-inventory-manager:${VERSION}
        env:
          VERSION: ${{ steps.version.outputs.version }}

  github-release:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        run: >-
          gh release create "$TAG"
          --repo "${{ github.repository }}"
          --title "v${{ needs.docker.outputs.version }}"
          --generate-notes
          ${{ needs.docker.outputs.is_release == 'false' && '--prerelease' || '' }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Consumers' flakes follow the `release` branch, not main, the way NixOS hosts follow a
  # nixpkgs channel branch: it moves only to a release tag whose test, nix and docker jobs all
  # passed. A plain push only fast-forwards, so re-releasing an older tag fails here rather than
  # moving the branch backwards.
  release-branch:
    runs-on: ubuntu-latest
    needs: [nix, docker, github-release]
    if: needs.docker.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Fast-forward the release branch
        run: git push origin HEAD:refs/heads/release
